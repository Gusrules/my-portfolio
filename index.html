<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Nikolas Al-Baboul – Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#e2e7ed; --ink:#14213d; --muted:#4d5a70; --line:#c3ccd8; --accent:#2b50ff; --on-accent:#fff;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --text:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1626;--surface:#19233a;--ink:#e8edf6;--muted:#9aa8c0;--line:#2c3a57;--accent:#7f95ff;--on-accent:#0f1626;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#19233a;--ink:#e8edf6;--muted:#9aa8c0;--line:#2c3a57;--accent:#7f95ff;--on-accent:#0f1626;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1875rem/1.6 var(--text)}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:.2em;text-decoration-thickness:2px}
a:hover{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:68rem;margin:0 auto;padding:0 1.5rem}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:-.02em}
.hero{padding:clamp(3rem,10vw,7rem) 0 3rem}
.hero h1{font-weight:800;font-size:clamp(2rem,calc((100vw - 21rem)/12),4.25rem);letter-spacing:-.03em;line-height:1;text-transform:uppercase;white-space:nowrap}
@media (max-width:760px){.hero h1{font-size:max(1.4rem,calc((100vw - 3rem)/12))}}
.hero .role{font:500 clamp(1.25rem,3vw,1.75rem)/1.3 var(--display);color:var(--accent);margin:1.25rem 0 1.5rem}
.hero p{max-width:38rem;margin:0 0 1.75rem;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;max-width:36rem}
@media (max-width:560px){.links{grid-template-columns:repeat(2,minmax(0,1fr))}}
.links .btn{text-align:center;padding:.6rem .5rem;white-space:nowrap}
.btn{display:inline-block;padding:.65rem 1.2rem;border:2px solid var(--ink);border-radius:999px;font:500 1rem var(--display);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
section{padding:3rem 0;border-top:2px solid var(--line)}
section>.wrap{display:grid;grid-template-columns:12rem 1fr;gap:2rem}
section h2{font-size:1.5rem;font-weight:800}
@media (max-width:760px){section>.wrap{grid-template-columns:1fr;gap:1.25rem}}
details{border-bottom:1px solid var(--line)}
details:first-child{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;padding:1.1rem 0;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary h3{font-size:1.5rem;font-weight:800}
summary .yr{font:500 1rem var(--display);color:var(--muted)}
summary .one{grid-column:1/-1;color:var(--muted);margin:0}
summary:hover h3{color:var(--accent)}
summary::after{content:"+";grid-column:2;grid-row:1;justify-self:end;display:none}
details[open] summary h3{color:var(--accent)}
.more{padding:0 0 1.5rem;max-width:40rem}
.more p{margin:0 0 1rem}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem;padding:0;list-style:none}
.tags li{background:var(--surface);padding:.15rem .7rem;border-radius:6px;font:500 .9rem var(--display)}
.tl{list-style:none;margin:0;padding:0 0 0 1.5rem;position:relative}
.tl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);transform-origin:top}
.tl li{position:relative;padding-bottom:2rem}
.tl li::before{content:"";position:absolute;left:calc(-1.5rem - 5px);top:.55rem;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.tl h3{font-size:1.3rem;font-weight:800}
.tl .when{font:500 .95rem var(--display);color:var(--muted);margin:.25rem 0 .5rem}
.tl p{margin:0;max-width:38rem}
.skills{display:grid;gap:1.25rem}
.skills h3{font-size:1.05rem;font-weight:800;margin-bottom:.25rem}
.skills p{margin:0;color:var(--muted)}
.contact p{margin:0 0 1.25rem;max-width:34rem}
.big{font:800 clamp(1.5rem,5vw,2.75rem)/1.1 var(--display);letter-spacing:-.03em;word-break:break-word}
footer{padding:2rem 0 3rem;color:var(--muted);font-size:1rem;border-top:2px solid var(--line)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:.6rem;padding-bottom:.6rem}
.brand{font:800 1.1rem var(--display);letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:.25rem;overflow-x:auto;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:.35rem .8rem;border-radius:999px;font:500 .95rem var(--display);text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:640px){.brand{display:none}}
.cv p{margin:0 0 1.25rem;max-width:34rem;color:var(--muted)}
.cform{display:grid;gap:1rem;max-width:34rem;margin-top:2rem}
.cform label{display:grid;gap:.35rem;font:500 .95rem var(--display)}
.cform input,.cform textarea{font:400 1.1rem var(--text);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:.7rem .85rem;width:100%}
.cform textarea{min-height:9rem;resize:vertical}
.cform input:focus,.cform textarea:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.cform button{justify-self:start;cursor:pointer;font:500 1rem var(--display);padding:.7rem 1.6rem;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.cform button:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.status{margin:0;color:var(--muted);min-height:1.5em}
.photo,.ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:var(--surface)}
.ph{display:grid;place-items:center;text-align:center;border:2px dashed var(--line);color:var(--muted);font:500 1rem var(--display)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 15rem;gap:2.5rem;align-items:center}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) 14rem;gap:2rem;align-items:start}
@media (max-width:760px){.hero-grid,.about-grid{grid-template-columns:1fr}.hero-photo{order:-1;width:8rem}.about-grid .photo,.about-grid .ph{max-width:16rem}}
[hidden]{display:none!important}
#name{position:relative}
#name .ghost{visibility:hidden}
#name .typed{position:absolute;left:0;top:0;right:0}
.caret{display:inline-block;width:.06em;height:.8em;margin-left:.06em;background:var(--accent);vertical-align:-.04em;animation:blink 1s step-end infinite}
.caret.off{opacity:0;animation:none;transition:opacity .6s}
@keyframes blink{50%{opacity:0}}
.shot{aspect-ratio:16/9;max-width:40rem;margin:0 0 1rem;object-fit:cover}
.shot.real{width:auto;max-width:100%;aspect-ratio:auto;height:auto;object-fit:contain;border:1px solid var(--line)}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity 1s ease var(--d,0s),transform 1s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.js .rv-r{transform:translateX(44px)}
.js .rv.in{opacity:1;transform:none}
.js .tl::before{transform:scaleY(0);transition:transform 2.2s cubic-bezier(.4,0,.2,1)}
.js .tl.in::before{transform:scaleY(1)}
.js .tl li{opacity:0;transform:translateY(46px)}
.js .tl li::before{transform:scale(0)}
.js .tl.in li{opacity:1;transform:none;transition:opacity 1.8s ease var(--d,0s),transform 1.8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.js .tl.in li::before{transform:scale(1);transition:transform .7s cubic-bezier(.3,1.6,.5,1) calc(var(--d,0s) + .4s)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-text>*{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.hero-text>:nth-child(2){animation-delay:.15s}
.hero-text>:nth-child(3){animation-delay:.3s}
.hero-text>:nth-child(4){animation-delay:.45s}
.hero-photo{animation:rise 1.3s cubic-bezier(.2,.7,.2,1) .35s both}
.hero-photo>*{animation:float 7s ease-in-out 1.8s infinite}
details[open] .more{animation:rise .6s ease both}
.btn{transition:background .25s,color .25s,border-color .25s,transform .25s}
.btn:hover{transform:translateY(-3px)}
summary h3{transition:transform .3s ease,color .25s}
summary:hover h3{transform:translateX(8px)}
.nav a{transition:background .25s,color .25s}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent);transform:scaleX(var(--p,0));transform-origin:left}
dialog{width:min(60rem,94vw);height:88vh;max-width:none;border:0;border-radius:12px;padding:0;background:var(--bg);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(10,15,30,.65)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-bar{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.7rem 1rem;border-bottom:2px solid var(--line);font:800 1.05rem var(--display)}
.dlg-bar div{display:flex;gap:.5rem}
.dlg .btn{cursor:pointer;background:transparent;color:var(--ink);padding:.4rem .9rem;font-size:.95rem}
.dlg-body{flex:1;overflow:auto;padding:1rem;background:var(--surface)}
.dlg-body img{display:block;width:100%;max-width:52rem;margin:0 auto 1rem;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv,.js .tl li,.js .tl::before,.js .tl li::before{opacity:1!important;transform:none!important;transition:none!important}.hero-text>*,.hero-photo,.hero-photo>*,details[open] .more{animation:none!important}.btn:hover,summary:hover h3{transform:none}}
</style>
</head>
<body id="top">
<div class="top"><div class="wrap">
  <a class="brand" id="brand" href="#top"></a>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div></div>
<main>
<header class="hero"><div class="wrap hero-grid">
  <div class="hero-text">
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p id="bio"></p>
    <div class="links" id="links"></div>
  </div>
  <div class="hero-photo" id="heroPhoto"></div>
</div></header>

<section id="about"><div class="wrap"><h2>About</h2><div class="about-grid"><div id="about-text"></div><div id="aboutPhoto"></div></div></div></section>
<section id="experience"><div class="wrap"><h2>Experience</h2><ol class="tl" id="jobs"></ol></div></section>
<section id="projects"><div class="wrap"><h2>Projects</h2><div id="projectList"></div></div></section>
<section id="skills"><div class="wrap"><h2>Skills</h2><div class="skills" id="skillList"></div></div></section>
<section id="cv" class="cv"><div class="wrap"><h2>CV</h2><div><p id="cvNote"></p><a class="btn primary" id="cvBtn" target="_blank" rel="noopener"></a></div></div></section>
<section id="contact" class="contact"><div class="wrap"><h2>Contact</h2><div>
  <p class="big" style="margin-bottom:.75rem">Want to talk?</p><p id="contactNote"></p>
  <form class="cform" id="cform">
    <label>Your name<input name="name" autocomplete="name" required></label>
    <label>Your email<input name="email" type="email" autocomplete="email" required></label>
    <label>What’s on your mind?<textarea name="message" placeholder="Tell me about the role, the project, or just say hi." required></textarea></label>
    <button type="submit">Send</button>
    <p class="status" id="status" role="status"></p>
  </form>
</div></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

/* ===== END EDIT BLOCK ===== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D = DATA;
document.title = D.name + " – Software Engineer";
{
  const h = $("name");
  h.setAttribute("aria-label", D.name);
  h.innerHTML = '<span class="ghost" aria-hidden="true"></span><span class="typed" aria-hidden="true"><span id="typedText"></span><span class="caret"></span></span>';
  h.querySelector(".ghost").textContent = D.name;
  const t = $("typedText"), caret = h.querySelector(".caret");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { t.textContent = D.name; caret.hidden = true; }
  else {
    let i = 0;
    setTimeout(function tick() {
      t.textContent = D.name.slice(0, ++i);
      if (i < D.name.length) setTimeout(tick, 90);
      else setTimeout(() => caret.classList.add("off"), 2500);
    }, 700);
  }
}
$("role").textContent = D.role;
$("bio").textContent = D.bio;
$("links").innerHTML =
  D.links.map(l => l.url.startsWith("#")
    ? `<a class="btn" href="${esc(l.url)}">${esc(l.label)}</a>`
    : `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
const shot = p => p.shot
  ? `<img class="photo shot real"${p.shotW ? ` style="width:${esc(p.shotW)}"` : ""} src="${esc(p.shot)}" alt="Screenshot of ${esc(p.title)}" loading="lazy">`
  : `<div class="ph shot" role="img" aria-label="Screenshot placeholder">Screenshot of ${esc(p.title)}</div>`;
$("projectList").innerHTML = D.projects.map(p => `
  <details><summary><h3>${esc(p.title)}</h3><span class="yr">${esc(p.year)}</span><p class="one">${esc(p.one)}</p></summary>
  <div class="more">${shot(p)}<p>${esc(p.details)}</p>
  <ul class="tags">${p.stack.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
  <a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkLabel)}</a></div></details>`).join("");
$("jobs").innerHTML = D.jobs.map(j => `<li><h3>${esc(j.title)}</h3><div class="when">${esc(j.when)}</div><p>${esc(j.text)}</p></li>`).join("");
$("skillList").innerHTML = D.skills.map(s => `<div><h3>${esc(s.group)}</h3><p>${esc(s.items)}</p></div>`).join("");
$("about-text").innerHTML = D.about.map(t => `<p style="margin:0 0 1rem;max-width:38rem">${esc(t)}</p>`).join("");
$("contactNote").textContent = D.contactNote;

$("foot").textContent = "© " + new Date().getFullYear() + " " + D.name;

$("brand").textContent = D.name;
const photo = p => p.src
  ? `<img class="photo" src="${esc(p.src)}" alt="${esc(p.alt)}">`
  : `<div class="ph" role="img" aria-label="Photo placeholder">Your photo</div>`;
$("heroPhoto").innerHTML = photo(D.photos.hero);
$("aboutPhoto").innerHTML = photo(D.photos.about);
$("cvNote").textContent = D.cv.note;
const cvBtn = $("cvBtn");
cvBtn.textContent = D.cv.label;
cvBtn.href = "documents/CV.pdf";
cvBtn.target = "_blank";
cvBtn.rel = "noopener";

const sections = [["About","about"],["Experience","experience"],["Projects","projects"],["Skills","skills"],["CV","cv"]];
$("nav").innerHTML = sections.map(([l,id]) => `<a href="#${id}">${l}</a>`).join("");
const navLinks = [...document.querySelectorAll("#nav a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  navLinks.forEach(a => a.removeAttribute("aria-current"));
  const a = navLinks.find(a => a.hash === "#" + e.target.id);
  if (a) a.setAttribute("aria-current", "true");
}), { rootMargin: "-30% 0px -65% 0px" });
sections.forEach(([, id]) => io.observe($(id)));

$("cform").addEventListener("submit", ev => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const body = f.get("message") + "\n\n" + f.get("name") + "\n" + f.get("email");
  location.href = "mailto:" + D.email + "?subject=" + encodeURIComponent("Portfolio message from " + f.get("name")) + "&body=" + encodeURIComponent(body);
  $("status").textContent = "Thanks for reaching out! Your email app should open with your message ready to send. If it doesn’t, you can reach me through LinkedIn.";
});
{
  const mark = (sel, base = 0, step = .12, extra = "") => document.querySelectorAll(sel).forEach((el, i) => {
    el.classList.add("rv"); if (extra) el.classList.add(extra);
    el.style.setProperty("--d", (base + i * step).toFixed(2) + "s");
  });
  mark("section h2"); mark("#about-text p", .1, .18); mark("#aboutPhoto", .3, 0, "rv-r");
  mark("#skillList > div", .1, .15); mark("#projectList details", .05, .14);
  mark("#cv .wrap > div", .1); mark(".contact .wrap > div", .1);
  document.querySelectorAll("#jobs li").forEach((li, i) => li.style.setProperty("--d", (.5 + i * .8) + "s"));
  const targets = [...document.querySelectorAll(".rv, #jobs")];
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    targets.forEach(t => t.classList.add("in"));
  } else {
    const rio = new IntersectionObserver((es, o) => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); o.unobserve(e.target); }
    }), { threshold: .15, rootMargin: "0px 0px -8% 0px" });
    targets.forEach(t => rio.observe(t));
  }
  const bar = document.querySelector(".top"), root = document.documentElement;
  addEventListener("scroll", () => bar.style.setProperty("--p", root.scrollTop / ((root.scrollHeight - root.clientHeight) || 1)), { passive: true });
}



</script>
</body>
